services:
  - type: web
    name: fiste-guiden
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MET_USER_AGENT
        value: "fiste-guiden/23 (+https://github.com/aikongen2026/sjoorret-live-kart)"
# Valgfritt: legg NVE_API_KEY inn manuelt i Render Environment for live HydAPI-data.
